[project]
name = "load-forecasting"
version = "0.1.0"
description = "Point-in-time-correct daily Swiss electricity load forecasting"
authors = [
    {name = "David Alvarez",email = "vigocpc@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy (>=1.26,<3.0)",
    "pandas (>=2.2,<3.0)",
    "pyarrow (>=23.0.1,<24.0.0)",
    "requests (>=2.32,<3.0)",
    "torch (>=2.6,<3.0)",
    "altair (>=5.5,<7.0)",
    "streamlit (>=1.44.0,<2.0.0)",
    "pydantic (>=2.13.2,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.12,<1.0"

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
package-mode = false 
